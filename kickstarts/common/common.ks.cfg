text
cdrom
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us
timezone UTC --utc
network --bootproto=static --device=@@INTERFACE@@ --ip=@@IP@@ --netmask=@@NETMASK@@ --gateway=@@GATEWAY@@ --nameserver=@@DNS@@ --hostname=@@HOSTNAME@@ --activate --onboot=yes
rootpw --lock
user --name=@@USER@@ --groups=wheel --lock
sshkey --username=@@USER@@ "@@SSH_KEY@@"
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,chronyd,firewalld,qemu-guest-agent
zerombr
ignoredisk --only-use=vda
clearpart --all --initlabel --drives=vda
autopart --type=lvm --fstype=xfs
bootloader --append="console=tty0 console=ttyS0,115200n8"
reboot
%packages
@^minimal-environment
openssh-server
chrony
firewalld
qemu-guest-agent
sudo
@@VM_PACKAGES@@
%end
%post --interpreter=/bin/bash --erroronfail --log=/root/ks-post.log
@@POST_INSTALL@@
%end
