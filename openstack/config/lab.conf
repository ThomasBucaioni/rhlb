# Copy to config/lab.conf and edit before running any script.
# This file is sourced by Bash scripts.

# ---------------------------------------------------------------------------
# Home PC hypervisor / libvirt
# ---------------------------------------------------------------------------
LIBVIRT_URI="qemu:///system"
STORAGE_POOL="default"
NAT_NETWORK="default"
MGMT_BRIDGE="virbr4"
PROVIDER_BRIDGE="mybridge0"
VM_DISK_DIR="/var/lib/libvirt/images"

# Path to a RHEL 10 DVD ISO or installation tree supported by virt-install.
RHEL_INSTALL_SOURCE="/var/lib/libvirt/boot/rhel-10.0-x86_64-dvd.iso"
KICKSTART_DIR="/path/to/kickstarts"
OS_VARIANT="rhel10.0"

# SSH/Kolla user
SSH_USER="user"
SSH_KEY="/home/user/.ssh/id_rsa"
SSH_KEY_ON_DEPLOYMENT="/home/user/.ssh/id_rsa"

# ---------------------------------------------------------------------------
# VM names, hostnames and management addresses
# ---------------------------------------------------------------------------
LAB_DOMAIN="ostacklab.local"

DEPLOYMENT_NAME="deployment"
DEPLOYMENT_FQDN="deployment.ostacklab.local"
DEPLOYMENT_IP="10.0.0.10"

CONTROLLER_NAME="controller"
CONTROLLER_FQDN="controller.ostacklab.local"
CONTROLLER_IP="10.0.0.11"

COMPUTE1_NAME="compute1"
COMPUTE1_FQDN="compute1.ostacklab.local"
COMPUTE1_IP="10.0.0.21"

COMPUTE2_NAME="compute2"
COMPUTE2_FQDN="compute2.ostacklab.local"
COMPUTE2_IP="10.0.0.22"

BLOCK1_NAME="block1"
BLOCK1_FQDN="block1.ostacklab.local"
BLOCK1_IP="10.0.0.41"

# ---------------------------------------------------------------------------
# VM resources (editable starting values; not confirmed historical values)
# ---------------------------------------------------------------------------
VM_DEPLOYMENT_VCPU=2
VM_DEPLOYMENT_RAM_MIB=4096
VM_DEPLOYMENT_ROOT_GIB=60
VM_DEPLOYMENT_DATA_GIB=0
VM_DEPLOYMENT_KS="deployment.ks"
VM_DEPLOYMENT_NETWORKS="management,nat"

VM_CONTROLLER_VCPU=4
VM_CONTROLLER_RAM_MIB=8192
VM_CONTROLLER_ROOT_GIB=80
VM_CONTROLLER_DATA_GIB=0
VM_CONTROLLER_KS="controller.ks"
# Provider first so it receives the first guest NIC; management second.
VM_CONTROLLER_NETWORKS="provider,management,nat"

VM_COMPUTE1_VCPU=2
VM_COMPUTE1_RAM_MIB=4096
VM_COMPUTE1_ROOT_GIB=60
VM_COMPUTE1_DATA_GIB=0
VM_COMPUTE1_KS="compute1.ks"
VM_COMPUTE1_NETWORKS="management,nat"

VM_COMPUTE2_VCPU=2
VM_COMPUTE2_RAM_MIB=4096
VM_COMPUTE2_ROOT_GIB=60
VM_COMPUTE2_DATA_GIB=0
VM_COMPUTE2_KS="compute2.ks"
VM_COMPUTE2_NETWORKS="management,nat"

VM_BLOCK1_VCPU=2
VM_BLOCK1_RAM_MIB=4096
VM_BLOCK1_ROOT_GIB=40
VM_BLOCK1_DATA_GIB=32
VM_BLOCK1_KS="block1.ks"
VM_BLOCK1_NETWORKS="management,nat"

# ---------------------------------------------------------------------------
# Kolla-Ansible / OpenStack
# ---------------------------------------------------------------------------
KOLLA_VENV="${HOME}/venvs/kolla"
KOLLA_CONFIG_DIR="/etc/kolla"
KOLLA_INVENTORY="${HOME}/multinode"
KOLLA_GIT_REF="stable/2026.1"
KOLLA_BASE_DISTRO="rocky"
OPENSTACK_RELEASE="2026.1"
KOLLA_INTERNAL_VIP="10.0.0.254"

# Interface names are guest-side names. Confirm with: ip -br link
# These defaults reflect the controller interface assignment recorded in the lab.
IFACE_CONTROLLER_MANAGEMENT="enp7s0"
IFACE_CONTROLLER_PROVIDER="enp1s0"
IFACE_COMPUTE1_MANAGEMENT="enp1s0"
IFACE_COMPUTE2_MANAGEMENT="enp1s0"
IFACE_BLOCK1_MANAGEMENT="enp1s0"

# Cinder LVM storage on block1
CINDER_DISK="/dev/vdb"
CINDER_VOLUME_GROUP="cinder-volumes"
CINDER_THINPOOL="cinder-volumes-pool"
CINDER_THINPOOL_PERCENT=95

# ---------------------------------------------------------------------------
# init-runonce values (verified against the installed Kolla-Ansible script)
# ---------------------------------------------------------------------------
DEMO_NET_CIDR="10.10.0.0/24"
DEMO_NET_GATEWAY="10.10.0.1"
DEMO_NET_DNS="192.168.1.254"

EXT_NET_CIDR="192.168.1.0/24"
EXT_NET_GATEWAY="192.168.1.254"
EXT_NET_RANGE_START="192.168.1.210"
EXT_NET_RANGE_END="192.168.1.220"
